<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeGuard — Helmet Detection System</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #080c10;
      --panel:     #0d1117;
      --border:    #1e2d3d;
      --accent:    #00e5ff;
      --warn:      #ff3d3d;
      --ok:        #00e676;
      --muted:     #3a4a5c;
      --text:      #c9d8e8;
      --text-dim:  #5a7080;
      --scan:      rgba(0,229,255,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow Condensed', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── GRID BACKGROUND ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(0,229,255,.04) 0%, transparent 100%);
    }

    .logo {
      display: flex; align-items: center; gap: 14px;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: var(--accent);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--bg); font-weight: 900;
      flex-shrink: 0;
    }

    .logo-text { line-height: 1; }
    .logo-text .brand {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px; font-weight: 700; letter-spacing: 3px;
      color: #fff;
    }
    .logo-text .sub {
      font-size: 10px; letter-spacing: 4px;
      color: var(--text-dim); text-transform: uppercase;
    }

    .header-right {
      display: flex; align-items: center; gap: 24px;
    }

    .conn-badge {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; letter-spacing: 1px;
      color: var(--text-dim);
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      transition: background .3s;
      box-shadow: 0 0 0 0 var(--muted);
    }
    .conn-dot.active {
      background: var(--ok);
      animation: pulse-dot 1.5s infinite;
    }
    .conn-dot.error { background: var(--warn); }

    @keyframes pulse-dot {
      0%   { box-shadow: 0 0 0 0 rgba(0,230,118,.6); }
      70%  { box-shadow: 0 0 0 6px rgba(0,230,118,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,230,118,0); }
    }

    .time-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px; color: var(--text-dim);
    }

    /* ── MAIN LAYOUT ── */
    main {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 0;
      height: calc(100vh - 73px);
    }

    /* ── CAMERA PANEL ── */
    .camera-section {
      grid-row: 1 / 3;
      padding: 24px 0 24px 24px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .camera-wrapper {
      position: relative;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      background: #000;
    }

    /* Corner accents */
    .camera-wrapper::before,
    .camera-wrapper::after {
      content: '';
      position: absolute;
      width: 24px; height: 24px;
      border-color: var(--accent);
      border-style: solid;
      z-index: 5;
    }
    .camera-wrapper::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
    .camera-wrapper::after  { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

    #cameraFeed {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }

    .feed-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: rgba(8,12,16,.85);
      transition: opacity .4s;
    }
    .feed-overlay.hidden { opacity: 0; pointer-events: none; }

    .feed-overlay svg { opacity: .3; }
    .feed-overlay p {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px; letter-spacing: 2px;
      color: var(--text-dim);
    }

    /* Scan line animation */
    .scan-line {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      animation: scan 3s linear infinite;
      pointer-events: none; z-index: 4;
    }
    .scan-line.active { opacity: 1; }

    @keyframes scan {
      0%   { top: 0%; }
      100% { top: 100%; }
    }

    /* Warning flash overlay */
    .warn-flash {
      position: absolute; inset: 0;
      border: 3px solid var(--warn);
      border-radius: 3px;
      opacity: 0;
      pointer-events: none; z-index: 6;
      transition: opacity .1s;
    }
    .warn-flash.flash { animation: flash-anim .5s ease-out; }

    @keyframes flash-anim {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ── BOTTOM STATS BAR ── */
    .stats-bar {
      display: flex; gap: 12px;
    }

    .stat-chip {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-chip .label {
      font-size: 9px; letter-spacing: 3px;
      color: var(--text-dim); text-transform: uppercase;
    }
    .stat-chip .value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 22px; color: var(--text);
      transition: color .3s;
    }
    .stat-chip.warn-chip .value { color: var(--warn); }
    .stat-chip.ok-chip .value   { color: var(--ok); }

    /* ── RIGHT SIDEBAR ── */
    .sidebar {
      grid-row: 1 / 3;
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      border-bottom: 1px solid var(--border);
      padding: 20px;
    }

    .section-title {
      font-size: 9px; letter-spacing: 4px;
      color: var(--text-dim); text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* ── ALERT PANEL ── */
    .alert-box {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      background: var(--panel);
      text-align: center;
      transition: all .3s;
    }
    .alert-box.safe {
      border-color: var(--ok);
      background: rgba(0,230,118,.05);
    }
    .alert-box.danger {
      border-color: var(--warn);
      background: rgba(255,61,61,.08);
      animation: danger-pulse 1s ease-in-out infinite;
    }

    @keyframes danger-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,61,61,0); }
      50%       { box-shadow: 0 0 20px 4px rgba(255,61,61,.2); }
    }

    .alert-icon { font-size: 36px; margin-bottom: 8px; }
    .alert-status {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px; font-weight: 700;
      letter-spacing: 2px;
    }
    .alert-box.safe   .alert-status { color: var(--ok); }
    .alert-box.danger .alert-status { color: var(--warn); }
    .alert-sub {
      font-size: 10px; letter-spacing: 2px;
      color: var(--text-dim); margin-top: 4px;
    }

    /* ── DETECTIONS LIST ── */
    .detections-list {
      display: flex; flex-direction: column; gap: 8px;
    }

    .det-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      animation: slide-in .2s ease-out;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .det-row .det-name {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
    }
    .det-badge {
      font-size: 9px; letter-spacing: 2px;
      padding: 2px 8px;
      border-radius: 2px;
      text-transform: uppercase;
    }
    .det-badge.ok     { background: rgba(0,230,118,.15); color: var(--ok); border: 1px solid rgba(0,230,118,.3); }
    .det-badge.danger { background: rgba(255,61,61,.15);  color: var(--warn); border: 1px solid rgba(255,61,61,.3); }

    .no-detections {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; color: var(--text-dim);
      text-align: center; padding: 20px 0;
      letter-spacing: 2px;
    }

    /* ── LOG ── */
    .log-section {
      flex: 1; overflow: hidden;
      display: flex; flex-direction: column;
      padding: 20px;
    }

    .log-feed {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 6px;
    }

    .log-feed::-webkit-scrollbar { width: 4px; }
    .log-feed::-webkit-scrollbar-track { background: transparent; }
    .log-feed::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    .log-entry {
      display: flex; gap: 10px; align-items: flex-start;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      animation: log-in .15s ease-out;
    }

    @keyframes log-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .log-time { color: var(--text-dim); flex-shrink: 0; }
    .log-msg.warn-msg  { color: var(--warn); }
    .log-msg.info-msg  { color: var(--text-dim); }
    .log-msg.ok-msg    { color: var(--ok); }

    /* ── CONNECT BTN ── */
    .connect-btn {
      display: block; width: calc(100% - 40px); margin: 0 20px 20px;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all .2s;
    }
    .connect-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }
    .connect-btn:disabled {
      border-color: var(--muted); color: var(--muted); cursor: not-allowed;
    }
    .connect-btn:disabled:hover { background: transparent; color: var(--muted); }

    /* ── AUDIO TOGGLE ── */
    .audio-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
    }
    .audio-label {
      font-size: 10px; letter-spacing: 3px;
      color: var(--text-dim); text-transform: uppercase;
    }
    .toggle {
      width: 36px; height: 20px;
      background: var(--muted);
      border-radius: 10px; position: relative;
      cursor: pointer; transition: background .2s;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px;
      background: #fff; border-radius: 50%;
      transition: transform .2s;
    }
    .toggle.on::after { transform: translateX(16px); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">S</div>
    <div class="logo-text">
      <div class="brand">SAFEGUARD</div>
      <div class="sub">PPE Detection System</div>
    </div>
  </div>
  <div class="header-right">
    <div class="conn-badge">
      <div class="conn-dot" id="connDot"></div>
      <span id="connLabel">DISCONNECTED</span>
    </div>
    <div class="time-display" id="clock">--:--:--</div>
  </div>
</header>

<main>
  <!-- CAMERA -->
  <section class="camera-section">
    <div class="camera-wrapper">
      <div class="scan-line" id="scanLine"></div>
      <div class="warn-flash" id="warnFlash"></div>
      <img id="cameraFeed" alt="Camera Feed"/>
      <div class="feed-overlay" id="feedOverlay">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect x="2" y="14" width="60" height="42" rx="4" stroke="#00e5ff" stroke-width="2"/>
          <circle cx="32" cy="35" r="12" stroke="#00e5ff" stroke-width="2"/>
          <circle cx="32" cy="35" r="5" fill="#00e5ff" opacity=".3"/>
          <rect x="22" y="8" width="20" height="8" rx="2" stroke="#00e5ff" stroke-width="2"/>
        </svg>
        <p>AWAITING CONNECTION</p>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-chip" id="fpsStat">
        <span class="label">Frame Rate</span>
        <span class="value" id="fpsVal">--</span>
      </div>
      <div class="stat-chip" id="stabStat">
        <span class="label">Detection</span>
        <span class="value" id="stabVal">--</span>
      </div>
      <div class="stat-chip" id="totalStat">
        <span class="label">Alerts Today</span>
        <span class="value" id="totalVal">0</span>
      </div>
      <div class="stat-chip" id="uptimeStat">
        <span class="label">Uptime</span>
        <span class="value" id="uptimeVal">00:00</span>
      </div>
    </div>
  </section>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Alert Status -->
    <div class="sidebar-section">
      <div class="section-title">Alert Status</div>
      <div class="alert-box safe" id="alertBox">
        <div class="alert-icon" id="alertIcon">🟢</div>
        <div class="alert-status" id="alertStatus">ALL CLEAR</div>
        <div class="alert-sub" id="alertSub">No violations detected</div>
      </div>
    </div>

    <!-- Detections -->
    <div class="sidebar-section">
      <div class="section-title">Live Detections</div>
      <div class="detections-list" id="detectionsList">
        <div class="no-detections">NO OBJECTS DETECTED</div>
      </div>
    </div>

    <!-- Audio Toggle -->
    <div class="audio-row">
      <span class="audio-label">Audio Alerts</span>
      <div class="toggle on" id="audioToggle"></div>
    </div>

    <!-- Event Log -->
    <div class="log-section">
      <div class="section-title">Event Log</div>
      <div class="log-feed" id="logFeed"></div>
    </div>

    <!-- Connect Button -->
    <button class="connect-btn" id="connectBtn" onclick="toggleConnect()">
      Connect to Camera
    </button>

  </aside>
</main>

<script>
  // ── State ──
  let ws = null;
  let connected = false;
  let audioEnabled = true;
  let alertCount = 0;
  let startTime = null;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // ── Clock ──
  setInterval(() => {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-GB');
  }, 1000);

  // ── Uptime ──
  setInterval(() => {
    if (!startTime) return;
    const s = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(s / 60), sec = s % 60;
    document.getElementById('uptimeVal').textContent =
      `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }, 1000);

  // ── Audio beep ──
  function beep(freq=1000, dur=300) {
    if (!audioEnabled) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = freq;
      o.type = 'square';
      g.gain.setValueAtTime(.3, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur/1000);
      o.start(); o.stop(audioCtx.currentTime + dur/1000);
    } catch(e) {}
  }

  // ── Log ──
  function addLog(msg, type='info') {
    const feed = document.getElementById('logFeed');
    const t = new Date().toLocaleTimeString('en-GB');
    const div = document.createElement('div');
    div.className = 'log-entry';
    div.innerHTML = `<span class="log-time">${t}</span><span class="log-msg ${type}-msg">${msg}</span>`;
    feed.insertBefore(div, feed.firstChild);
    if (feed.children.length > 50) feed.removeChild(feed.lastChild);
  }

  // ── Connection ──
  function toggleConnect() {
    if (connected) {
      disconnect();
    } else {
      connect();
    }
  }

  function connect() {
    try {
      ws = new WebSocket('ws://localhost:8765');

      ws.onopen = () => {
        connected = true;
        startTime = Date.now();
        document.getElementById('connDot').className = 'conn-dot active';
        document.getElementById('connLabel').textContent = 'CONNECTED';
        document.getElementById('connectBtn').textContent = 'Disconnect';
        document.getElementById('scanLine').classList.add('active');
        document.getElementById('feedOverlay').classList.add('hidden');
        addLog('Connection established', 'ok');
        beep(800, 150);
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        updateUI(data);
      };

      ws.onclose = () => {
        if (connected) {
          connected = false;
          onDisconnect();
          addLog('Connection lost', 'warn');
        }
      };

      ws.onerror = () => {
        addLog('Connection error — is server running?', 'warn');
        onDisconnect();
      };

    } catch(err) {
      addLog('Failed to connect', 'warn');
    }
  }

  function disconnect() {
    if (ws) ws.close();
    connected = false;
    onDisconnect();
    addLog('Disconnected by user', 'info');
  }

  function onDisconnect() {
    document.getElementById('connDot').className = 'conn-dot error';
    document.getElementById('connLabel').textContent = 'DISCONNECTED';
    document.getElementById('connectBtn').textContent = 'Connect to Camera';
    document.getElementById('scanLine').classList.remove('active');
    document.getElementById('feedOverlay').classList.remove('hidden');
    document.getElementById('fpsVal').textContent = '--';
    document.getElementById('stabVal').textContent = '--';
    startTime = null;
  }

  // ── Update UI ──
  const dangerClasses = new Set(['no_helmet']);

  function updateUI(data) {
    // Frame
    document.getElementById('cameraFeed').src = 'data:image/jpeg;base64,' + data.frame;

    // FPS
    const fpsEl = document.getElementById('fpsVal');
    fpsEl.textContent = data.fps;

    // Stability
    const stabEl = document.getElementById('stabVal');
    const stabStat = document.getElementById('stabStat');
    stabEl.textContent = data.status;
    stabStat.className = 'stat-chip ' + (data.status === 'STABLE' ? 'ok-chip' : 'warn-chip');

    // Alert
    const box = document.getElementById('alertBox');
    const icon = document.getElementById('alertIcon');
    const status = document.getElementById('alertStatus');
    const sub = document.getElementById('alertSub');

    if (data.has_no_helmet) {
      box.className = 'alert-box danger';
      icon.textContent = '⛔';
      status.textContent = 'VIOLATION';
      sub.textContent = 'Helmet not detected!';
    } else {
      box.className = 'alert-box safe';
      icon.textContent = '🟢';
      status.textContent = 'ALL CLEAR';
      sub.textContent = 'No violations detected';
    }

    // Flash + beep on alert
    if (data.alert) {
      alertCount++;
      document.getElementById('totalVal').textContent = alertCount;
      const flash = document.getElementById('warnFlash');
      flash.classList.remove('flash');
      void flash.offsetWidth;
      flash.classList.add('flash');
      beep(1100, 400);
      addLog('⛔ NO HELMET DETECTED — ALERT TRIGGERED', 'warn');
    }

    // Detections
    const list = document.getElementById('detectionsList');
    if (data.detected && data.detected.length > 0) {
      const counts = {};
      data.detected.forEach(d => counts[d] = (counts[d]||0)+1);
      list.innerHTML = Object.entries(counts).map(([name, cnt]) => {
        const isDanger = dangerClasses.has(name);
        const badge = isDanger
          ? '<span class="det-badge danger">VIOLATION</span>'
          : '<span class="det-badge ok">OK</span>';
        return `<div class="det-row">
          <span class="det-name">${name.replace(/_/g,' ').toUpperCase()}${cnt>1?' ×'+cnt:''}</span>
          ${badge}
        </div>`;
      }).join('');
    } else {
      list.innerHTML = '<div class="no-detections">NO OBJECTS DETECTED</div>';
    }
  }

  // ── Audio toggle ──
  document.getElementById('audioToggle').addEventListener('click', function() {
    audioEnabled = !audioEnabled;
    this.classList.toggle('on', audioEnabled);
  });
</script>
</body>
</html>
